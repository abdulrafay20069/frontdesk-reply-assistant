services:
  postgres:
    image: postgres:16
    container_name: frontdesk-postgres
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
    ports:
      - "5432:5432"
    volumes:
      - frontdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontdesk-postgres-data:
